name = "gw2-world-events"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Persists console.log output to your Cloudflare account so it can be viewed
# in the dashboard (Workers & Pages -> gw2-world-events -> Observability)
# without needing `wrangler tail` running locally.
[observability]
enabled = true

# Regenerates src/live_event_maps.generated.ts from the client's compiled-in
# roster (events_live.cpp) before every `wrangler dev`/`deploy` - Wrangler runs
# this itself, so it fires for a bare `npx wrangler deploy` too, not just
# `npm run deploy`. Same idiom as bump_rev.py on the addon side.
[build]
command = "python3 scripts/sync_live_event_maps.py"

# Durable Objects run on the Workers Free plan. Each shard (map instance) gets
# its own ShardObject: holds live WebSocket connections (hibernation-eligible,
# so idle viewers cost nothing) and an embedded SQLite last-10-per-event
# buffer. No separate database.
[[durable_objects.bindings]]
name = "SHARDS"
class_name = "ShardObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShardObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShardObject"]

# Uncomment to move off the free plan later if usage ever needs it - a
# toggle, not a rearchitecture (see networking-handoff.md).
# workers_dev = true

# --------------------------------------------------------------------------
# [env.staging] - separate deployment, named/bound independently of the
# default config above, for testing the relay leg (step 7,
# live-toast-handoff.md) without touching the production "gw2-world-events"
# Worker or its already-connected clients. The default config above has no
# NOTIFY_RELAY binding, so relayToNotify (shard-object.ts) is a guaranteed
# no-op there regardless of what ships in the code - nothing here changes
# until you deploy --env staging explicitly.
#
# Deploy:      npx wrangler deploy --env staging
# Dev locally: npx wrangler dev --env staging
# One-time:    npx wrangler secret put RELAY_SECRET --env staging
#              (same value as server-notify's own RELAY_SECRET)
#
# Environments don't inherit [[durable_objects.bindings]]/[[migrations]]
# from the default section, so both are repeated below - a different `name`
# makes this a fully separate Worker/DO namespace/SQLite storage from
# production, so migration history starts fresh at v1 here too. Verify this
# shape against your installed Wrangler version's docs before relying on it;
# environment-inheritance semantics have shifted across Wrangler releases.
# --------------------------------------------------------------------------
[env.staging]
name = "gw2-world-events-staging"

[[env.staging.durable_objects.bindings]]
name = "SHARDS"
class_name = "ShardObject"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ShardObject"]

# Points at server-notify's *production* Worker by name - there's only one
# server-notify deployment; staging here is only about isolating the shard
# side. Swap in a staging server-notify name/environment instead if you'd
# rather isolate both legs.
[[env.staging.services]]
binding = "NOTIFY_RELAY"
service = "gw2-world-events-notify"